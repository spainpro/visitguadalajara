<script>
const municipios = document.getElementById('municipios');
const STORAGE_KEY = 'guadalajara-visited';
let dragging = false;
let visitedColour = '#008000';
let unvisitedColour = '#F7F7F7';
let strokeWidth = 0.25;
let highlightedElement = null;

const totalMunicipios = (() => {
  const names = new Set();
  document.querySelectorAll('#municipios path').forEach(el => { const name = el.getAttribute('data-name'); if (name) names.add(name); });
  return Math.min(names.size, 288);
})();

function updateProgress() {
  const visitedSet = new Set();
  document.querySelectorAll('#municipios path[data-visited="true"]').forEach(el => { const name = el.getAttribute('data-name'); if (name) visitedSet.add(name); });
  const visitedCount = visitedSet.size;
  const percentage = Math.round((visitedCount / totalMunicipios) * 100);
  document.getElementById('progress').textContent = `${visitedCount}/${totalMunicipios} (${percentage}%)`;
}

function applyBaseStyle() {
  document.querySelectorAll('#municipios path').forEach(el => {
    const visited = el.getAttribute('data-visited') === 'true';
    el.setAttribute('fill', visited ? visitedColour : unvisitedColour);
    el.setAttribute('stroke', '#D0D0D0');
    el.setAttribute('stroke-width', strokeWidth);
  });
  if (highlightedElement) { highlightedElement.setAttribute('stroke', '#FFA500'); highlightedElement.setAttribute('stroke-width', 1.2); }
}

function saveVisited() {
  const visitedSet = new Set();
  document.querySelectorAll('#municipios path[data-visited="true"]').forEach(el => { const name = el.getAttribute('data-name'); if (name) visitedSet.add(name); });
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(visitedSet))); } catch (e) { console.warn('No se pudieron guardar las visitas:', e); }
}

function loadVisited() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return false;
    const visitedSet = new Set(JSON.parse(saved));
    document.querySelectorAll('#municipios path').forEach(el => {
      const name = el.getAttribute('data-name');
      el.setAttribute('data-visited', visitedSet.has(name));
    });
    return true;
  } catch(e) { console.warn('No se pudieron cargar las visitas:', e); return false; }
}

function importFromURL() {
  const encoded = new URLSearchParams(window.location.search).get('v');
  if (!encoded) return false;
  try {
    const jsonString = decodeURIComponent(escape(atob(encoded)));
    const visitedSet = new Set(JSON.parse(jsonString));
    document.querySelectorAll('#municipios path').forEach(el => {
      const name = el.getAttribute('data-name');
      el.setAttribute('data-visited', visitedSet.has(name));
    });
    saveVisited();
    return true;
  } catch(e) { console.warn('No se pudo importar desde URL:', e); return false; }
}

function exportVisits() {
  const visitedSet = new Set();
  document.querySelectorAll('#municipios path[data-visited="true"]').forEach(el => { const name = el.getAttribute('data-name'); if (name) visitedSet.add(name); });
  const blob = new Blob([JSON.stringify(Array.from(visitedSet), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'guadalajara_visitados.json';
  link.click();
  URL.revokeObjectURL(url);
}

function importVisits(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const visitedSet = new Set(JSON.parse(e.target.result.trim()));
      document.querySelectorAll('#municipios path').forEach(el => { const name = el.getAttribute('data-name'); el.setAttribute('data-visited', visitedSet.has(name)); });
      applyBaseStyle(); saveVisited(); updateProgress();
    } catch(err) { alert('No se pudo importar el archivo. Usa el JSON exportado desde esta app.'); }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function shareProgress() {
  const visitedSet = new Set();
  document.querySelectorAll('#municipios path[data-visited="true"]').forEach(el => { const name = el.getAttribute('data-name'); if (name) visitedSet.add(name); });
  const base64 = btoa(unescape(encodeURIComponent(JSON.stringify(Array.from(visitedSet)))));
  const shareUrl = `${window.location.origin}${window.location.pathname}?v=${encodeURIComponent(base64)}`;
  if (navigator.share) navigator.share({ title: 'Municipios visitados de Guadalajara', text: 'Mi mapa de municipios visitados:', url: shareUrl }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(shareUrl).then(() => alert('Enlace copiado al portapapeles.'));
  else alert('Copia este enlace: ' + shareUrl);
}

function exportImage() {
  const svg = document.getElementById('svgMap');
  const originalViewBox = svg.getAttribute('data-original-viewbox') || '0 0 800 468';
  const parts = originalViewBox.split(/\s+/).map(parseFloat);
  const origWidth = parts[2] || 800;
  const origHeight = parts[3] || 468;
  const clonedSvg = svg.cloneNode(true);
  clonedSvg.setAttribute('viewBox', originalViewBox);
  clonedSvg.setAttribute('width', origWidth);
  clonedSvg.setAttribute('height', origHeight);
  clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const svgString = new XMLSerializer().serializeToString(clonedSvg);
  const url = URL.createObjectURL(new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' }));
  const img = new Image();
  img.onload = function() {
    const scaleFactor = 7;
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(origWidth * scaleFactor);
    canvas.height = Math.round(origHeight * scaleFactor);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(scaleFactor, scaleFactor);
    ctx.drawImage(img, 0, 0, origWidth, origHeight);
    URL.revokeObjectURL(url);
    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = 'mapa_municipios_visitados_guadalajara.png';
    link.click();
  };
  img.src = url;
}

function searchMunicipio() {
  const input = document.getElementById('searchInput');
  const query = input.value.trim().toLowerCase();
  if (!query) return;
  let found = null;
  document.querySelectorAll('#municipios path').forEach(el => { if (!found && (el.getAttribute('data-name') || '').toLowerCase().includes(query)) found = el; });
  if (!found) { alert('No se encontró ningún municipio con ese nombre.'); return; }
  if (highlightedElement) { highlightedElement.setAttribute('stroke', '#D0D0D0'); highlightedElement.setAttribute('stroke-width', strokeWidth); }
  highlightedElement = found;
  found.setAttribute('stroke', '#FFA500'); found.setAttribute('stroke-width', 1.2);
  const bbox = found.getBBox();
  const maxDim = Math.max(bbox.width, bbox.height) * 3;
  if (window.viewBox && window.applyViewBox) {
    window.viewBox.w = maxDim; window.viewBox.h = maxDim;
    window.viewBox.x = bbox.x + bbox.width / 2 - maxDim / 2;
    window.viewBox.y = bbox.y + bbox.height / 2 - maxDim / 2;
    window.applyViewBox();
  }
}

municipios.addEventListener('click', function(event) {
  if (dragging) { dragging = false; return; }
  const target = event.target;
  if (!target || target.tagName.toLowerCase() !== 'path' || !target.getAttribute('data-name')) return;
  const name = target.getAttribute('data-name');
  const newVisited = !(target.getAttribute('data-visited') === 'true');
  document.querySelectorAll('#municipios path').forEach(el => {
    if (el.getAttribute('data-name') === name) {
      el.setAttribute('data-visited', newVisited);
      el.setAttribute('fill', newVisited ? visitedColour : unvisitedColour);
      el.setAttribute('stroke', '#D0D0D0');
      el.setAttribute('stroke-width', strokeWidth);
    }
  });
  saveVisited(); updateProgress();
});

function initDatalist() {
  const dl = document.createElement('datalist'); dl.id = 'municipiosList';
  const names = new Set();
  document.querySelectorAll('#municipios path').forEach(el => { const name = el.getAttribute('data-name'); if (name) names.add(name); });
  Array.from(names).sort().forEach(name => { const option = document.createElement('option'); option.value = name; dl.appendChild(option); });
  document.getElementById('controlsPanel').appendChild(dl);
}

(function init() {
  applyBaseStyle();
  if (!importFromURL()) loadVisited();
  applyBaseStyle(); updateProgress(); initDatalist();
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(err => console.warn('Fallo service worker:', err)));
})();

(function initPanZoom() {
  const svg = document.getElementById('svgMap');
  const vb = svg.viewBox.baseVal;
  const original = { x: vb.x, y: vb.y, w: vb.width, h: vb.height };
  let viewBox = { ...original };
  window.viewBox = viewBox;
  window.applyViewBox = function() { svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`); };
  function zoomAt(clientX, clientY, factor) {
    const r = svg.getBoundingClientRect();
    const mx = clientX - r.left, my = clientY - r.top;
    const sx = viewBox.x + (mx / r.width) * viewBox.w;
    const sy = viewBox.y + (my / r.height) * viewBox.h;
    viewBox.w *= factor; viewBox.h *= factor;
    viewBox.x = sx - (mx / r.width) * viewBox.w;
    viewBox.y = sy - (my / r.height) * viewBox.h;
    window.applyViewBox();
  }
  svg.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 0.9 : 1.1); }, { passive: false });
  svg.addEventListener('dblclick', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, 0.5); });
  let isPanning = false, last = { x: 0, y: 0 }, pinchDist = 0, pinchStart = null;
  svg.addEventListener('mousedown', e => { if (e.button !== 0) return; isPanning = true; dragging = false; last = { x: e.clientX, y: e.clientY }; });
  window.addEventListener('mousemove', e => { if (!isPanning) return; dragging = true; const r = svg.getBoundingClientRect(); const dx = e.clientX - last.x, dy = e.clientY - last.y; last = { x: e.clientX, y: e.clientY }; viewBox.x -= dx * viewBox.w / r.width; viewBox.y -= dy * viewBox.h / r.height; window.applyViewBox(); });
  window.addEventListener('mouseup', () => isPanning = false);
  svg.addEventListener('touchstart', e => {
    if (e.touches.length === 1) { isPanning = true; dragging = false; last = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }
    else if (e.touches.length === 2) { isPanning = false; dragging = false; const [a,b] = e.touches; pinchDist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); pinchStart = { ...viewBox }; }
  }, { passive: false });
  svg.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && isPanning) { e.preventDefault(); dragging = true; const t = e.touches[0]; const r = svg.getBoundingClientRect(); const dx = t.clientX-last.x, dy = t.clientY-last.y; last = { x:t.clientX, y:t.clientY }; viewBox.x -= dx*viewBox.w/r.width; viewBox.y -= dy*viewBox.h/r.height; window.applyViewBox(); }
    else if (e.touches.length === 2 && pinchStart) { e.preventDefault(); const [a,b] = e.touches; const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); const ratio = pinchDist / dist; const r = svg.getBoundingClientRect(); const midX = (a.clientX+b.clientX)/2, midY=(a.clientY+b.clientY)/2; const sx = pinchStart.x + (midX-r.left)/r.width*pinchStart.w; const sy = pinchStart.y + (midY-r.top)/r.height*pinchStart.h; viewBox.w = pinchStart.w*ratio; viewBox.h = pinchStart.h*ratio; viewBox.x = sx - (midX-r.left)/r.width*viewBox.w; viewBox.y = sy - (midY-r.top)/r.height*viewBox.h; window.applyViewBox(); }
  }, { passive: false });
  svg.addEventListener('touchend', e => { if (e.touches.length === 0) { isPanning = false; pinchStart = null; } });
})();
